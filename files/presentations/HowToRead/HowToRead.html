# What About Graduate Students?

.font150[

* More Difficult to Gauge

* In my teaching I have noticed a theme
   - Graduate school students approach reading in much the same way as in high school and undergrad. 
   - Putting it bluntly: consuming words on a page for repetition later on. 
   - Though: this is more true for coursework than dissertation work.

This strategy can and usually does work well in high school and undergrad. 

Things should be different in graduate school.

(Actually, things should be different in high school and undergrad too).

Let's spend some time on what it means to read something deeply, and how we can do it better. 

]

# Adler's Framework

* First published in 1940, Adler sought to teach active, thoughtful reading, to foster the art of learning, to democratize conversation and the exchange of important ideas, and to enable people to become self-learners. 

* reading &amp;rarr; four levels:

--

   - **Elementary reading**: grasp the superficial meaning of the words, follow grammar, understand basic ideas.

--

   - **Inspectional reading**: is the book/article worthy of more time? Systematic inspection (table of contents, the index, the references), skimming chapters to gauge structure, tone, and main ideas. 

--

   - **Analytical reading**: harder work begins. An active "reading to understand". Assess whether and why content is valid, coming up with thoughtfully constructed reasons for or against.

--

   - **Syntopical reading**: read multiple books and articles in a comparative, synthetic way. The word "syntopical" combines two Greek root words including "syn" meaning together, and "topos" meaning place or subject.

--

One mark of a good academic program is that it gives students the skills and strategies to be able to read analytically and syntopically in an efficient and effective way.

However, there are other dimensions to reading that are not entirely captured by Adler's distinctions.

# Three Modes of Reading


.font150[

Generally, when one engages with a particular text, whether a book or article, one can approach reading in a number of ways. Three that we cover here include didactic reading, dialectic reading, and hermeneutic reading. 

]

---

# Didactic Reading


.pull-left-a-little[

.font150[

* Goal &amp;rarr; absorb material as is, usually to replicate or repeat. 

* It is "instructional reception" of material.

* **Importantly:** Involves &lt;u&gt;accepting the authority of the material you are reading without much questioning&lt;/u&gt;.

]

]

.pull-right-a-little[

&lt;div style="display: flex; justify-content: center; align-items: center;"&gt;
  &lt;img src="images/kungfu.gif" style="width: 500px;"&gt;
&lt;/div&gt;

]

---
# Didactic Reading: Example

.font150[

For example (in this case, from Wikipedia) on photosynthesis:

&gt; Photosynthesis is a system of biological processes by which photopigment-bearing autotrophic organisms, such as most plants, algae and cyanobacteria, convert light energy — typically from sunlight — into the chemical energy necessary to fuel their metabolism. The term photosynthesis usually refers to oxygenic photosynthesis, a process that releases oxygen as a byproduct of water splitting. Photosynthetic organisms store the converted chemical energy within the bonds of intracellular organic compounds (complex compounds containing carbon), typically carbohydrates like sugars (mainly glucose, fructose and sucrose), starches, phytoglycogen and cellulose. When needing to use this stored energy, an organism's cells then metabolize the organic compounds through cellular respiration. 

]

---
# Didactic Reading: Example

.font150[

* Involves understanding the words, grammar, and immediate implications of the text.

* Internalizing the text without much added. 

* Closely related to Adler's Elementary and Inspectional reading.

* An attempt to commit to memory key features of assigned reading material. 

* "Depth" attained via note-taking, self-quizzing, and **repetition.**

]

---
class: center, middle
# Didactic Reading: Example

.font150[

Didactic reading is essential, and one cannot develop intellectually without it. However, to really develop an ability to understand and think, didactic reading is not enough. 

As noted in the opening quote by the famous philosopher, John Locke, "We are of the ruminating kind, and it is not enough to cram ourselves with a great load of collections; unless we chew them over again, they will not give us strength and nourishment."

]

---
# Dialectic Reading

.font150[

* Back and forth conversation with the text

* "Dialectic" derives from a Greek work connoting the "art of discussion, discourse, dialogue."

* Dialectic reading involves engaging in a specific "conversation" with the text so that a lack of clarity is resolved

For example, referring back to our passage above: "When needing to use this stored energy, an organism's cells then metabolize the organic compounds through cellular respiration," you may recognize that cellular respiration occurs in humans in an organelle called the mitochondria. This might lead to a question about whether plants have mitochondria, and where, exactly, the process of photosynthesis occurs in the plant cell?

]

---
# Dialectic Reading

.font150[

Personalized is important here, as this makes the dialogue you have with the text your own. 

There are a number of guidelines on what kind of questions to ask while you're reading a text. For instance, "what is the central point of this passage?" or "what are the symbols and metaphors used?" or "how do the findings of this scientific study relate to existing knowledge?" These are all important questions in their own contexts, but they are too generic to be of use to you, specifically. 

The key here is that YOU are having a dialogue with the text. To do this well, you need to use the text to develop **your own** line of questioning, your own views, and balance how and whether you will use the text to re-evaluate and update your own understanding of the world.


]

---

# Hermeneutic Reading

.font150[

* "Hermeneutics" is derived from the Greek word for "translate" or "interpret". 

* Forces the reader to ask about the *conditions* under which a text is produced and the *broader meanings* it carries.

* The art of interpretation, where the context, intentions, and consequences of a text are examined alongside its content.

]

---
# Chocolate and Weight Loss: Bohannon et al 2015 International Archives of Medicine

ABSTRACT:
Background: Although the focus of scientific studies on the beneficial properties of chocolate with a high cocoa content has increased in recent years, studies determining its importance for weight regulation, in particular within the context of a controlled dietary measure, have rarely been conducted. ... Conclusion: Consumption of chocolate with a high cocoa content can significantly increase the success of weight-loss diets. The weight-loss effect of this diet occurs with a certain delay. Long-term weight loss, however, seems to occur easier and more successfully by adding chocolate. The effect of the chocolate, the so-called "weight loss turbo," seems to go hand in hand with personal well-being, which was significantly higher than in the control groups. 

.font150[

If read didactively, one might simply absorb the claim: "eating dark chocolate helps with weight loss."

If read dialectically, one might analyze the paper on its more general scientific merits

A hermeneutic reading goes deeper still: *why* was this study published at all?, *what* were the motivations of the authors, editorial team, funders, etc? and *how* did it become international news?

]

---
# Eat Dark Chocolate and Lose Weight

.font150[

* Looking at the broader context: deliberate hoax, orchestrated to expose flaws in scientific journalism ([see this blog post for more](https://statmodeling.stat.columbia.edu/2015/05/29/i-fooled-millions-into-thinking-chocolate-helps-weight-loss-heres-how/)). 

* The journal that accepted the paper had low standards and little peer review. 

* Media outlets amplified the claim without skepticism: catchy headline. 

* General public, accustomed to dramatic health claims, spread the story widely. 

Hermeneutically, then, the text is not just about chocolate and weight loss—it is about the structures of modern science, media, and culture that allowed a flimsy claim to travel far and wide. The lesson is that reading carefully requires us not only to evaluate *what* is said, but also to interpret *why* it is said, *who benefits*, and *what the surrounding context reveals* about knowledge itself.

]



---
# SSRIs During Pregnancy and Autism Risk
 
Brown et al JAMA 2017;317;(15):1544-1552. doi:10.1001/jama.2017.3415 

.font120[

* Roughly 36,000 singleton pregnancies documented in administrative health claims data in Ontario, Canada. 

* "Exposure" to SSRIs was defined as two or more consecutive prescriptions to SSRIs between conception and delivery. 

* Hazard ratio of 1.59 with 95% confidence intervals of 1.17 to 2.17 after adjustment. 

* Second analysis with IPW, with weights constructed via HDPS with roughly 500 covariates. 

* Second hazard ratio: 1.61, with 95% confidence intervals of 0.997 to 2.59. 

* **Conclusion**: "In children born to mothers receiving public drug coverage in Ontario, Canada, in utero serotonergic antidepressant exposure compared with no exposure *was not* \[emphasis added\] associated with autism spectrum disorder in the child."

]



---
# SSRIs During Pregnancy and Autism Risk

.font120[

* Why interpret hazard ratios of 1.6 as "no association"? 

* Main justification: 95% CIs for the HDPS analysis barely included the null value. 

* Well known mis-use of tools for statistical inference (dichotomania)

* particularly relevant in this case: IPW with HDPS methods yields conservative (larger) standard errors 

]


the entire weight of the conclusion of "no association" is based on a known weakness in methodology. Why? How? [Sander Greenland](https://www.youtube.com/watch?v=nB4fGwYgb-c) (minute 38) has suggested that this interpretation may have been forced onto the authors by the editorial team at JAMA. 

After all, SSRIs are an extremely common medication prescribed to roughly 15% of the US population, and are thought to generate billions in revenue every year. Having a paper published in a prestigious journal like JAMA stating that taking SSRIs during pregnancy increases autism risk in children based on an observational study might have led to attention that the editorial team was simply not interested in. 

---
# SSRIs During Pregnancy and Autism Risk

There may be a number of reasons as to why Brown et al interpreted this 60% elevated risk in those taking SSRIs as "no association"

One should not take this interpretation at face value.

# Hermeneutic Reading

Hermeneutic reading can be thought of as the attempt to try to understand the (implicit or explicit) perspectives, assumptions, motivations, and frameworks that the author of what you are reading is using or forced to reckon with. 

Reading something hermeneutically involves trying to understand the motivations of the author, and how the author's context is framing the arguments they are making. Effectively, the goal here is to try and understand the factors and forces outside of the authors that led them to their arguments and conclusions. 

---
# Hermeneutic Reading: A More Philosophical Angle

.font150[

Consider Wittgenstein's Ladder:

&gt; My propositions serve as elucidations in the following way: anyone who understands me eventually recognizes them as nonsensical, when he has used them—as steps—to climb beyond them. (He must, so to speak, throw away the ladder after he has climbed up it.)  
&gt; He must transcend these propositions, and then he will see the world aright.

— Ludwig Wittgenstein, _Tractatus Logico-Philosophicus_[[4]](https://en.wikipedia.org/wiki/Wittgenstein%27s_ladder#cite_note-umass-4)

]

---
# Hermeneutic Reading: A More Philosophical Angle

Wittgenstein's ladder: "language" constrains thought, and thus our ability to understand reality. We should (at the very least) recognize this can be the case.

This is everywhere: 

Einstein's "space-time" continuum: we simply cannot "visualize" four dimensions. 

Quantum mechanics: [https://www.youtube.com/shorts/Wzc0rCniHag](https://www.youtube.com/shorts/Wzc0rCniHag)

Try explaining the color red to someone born blind. Try describing what music sounds like to someone born deaf. 

No amount of clever metaphor fully bridges the gap because the concepts rely on experiences that cannot be translated into other terms. 

Most of the major, earth shattering breakthroughs in science (at least that I can think of) were characterized by these challenges.

In each case, the breakthrough required not just new information but new ways of structuring thought itself. The concepts we have available to us act like the bars of a cage: they give us a place to stand and think, but they also limit where we can go.

---
# Hermeneutic Reading: A More Philosophical Angle

Hermeneutic reading, from this philosophical perspective, means recognizing that every text is written from within a conceptual cage that is almost impossible to escape. 

This is why Wittgenstein suggested his propositions should be discarded like a ladder after climbing—they point toward something that cannot be directly stated within the system of language itself. 

As we seek to move further and further into the vanguard of modern thought and knowledge, we inevitably run into the barriers of our own tools (consciousness, language, methods, frameworks, etc).

---
# Wrapping Up

.font150[

Reading is one of the most fundamental skills for intellectual work, yet evidence suggests we are losing our capacity for deep, critical reading. Moving beyond passive consumption of text requires mastering multiple modes of engagement with written material.

Adler's Foundation: Elementary, Inspectional, Analytical, Syntopical 

Three Essential Reading Modes: 
1. Didactic Reading: The absorption of information as presented. 
2. Dialectic Reading: Engaging in active personalized dialogue with the text. 
3. Hermeneutic Reading: Considering context, constraints, and frameworks that shaped the text. Two levels:
   - Sociocultural hermeneutics
   - Philosophical hermeneutics

]

(function(d) {
  const hlines = d.querySelectorAll('.remark-code-line-highlighted');
  const preParents = [];
  const findPreParent = function(line, p = 0) {
    if (p > 1) return null; // traverse up no further than grandparent
    const el = line.parentElement;
    return el.tagName === "PRE" ? el : findPreParent(el, ++p);
  };

  for (let line of hlines) {
    let pre = findPreParent(line);
    if (pre && !preParents.includes(pre)) preParents.push(pre);

slideshow._releaseMath = function(el) {
  var i, text, code, codes = el.getElementsByTagName('code');
  for (i = 0; i < codes.length;) {
    code = codes[i];
    if (code.parentNode.tagName !== 'PRE' && code.childElementCount === 0) {
      text = code.textContent;
      if (/^\\\((.|\s)+\\\)$/.test(text) || /^\\\[(.|\s)+\\\]$/.test(text) ||

          /^\\begin\{([^}]+)\}(.|\s)+\\end\{[^}]+\}$/.test(text)) {
        code.outerHTML = code.innerHTML;  // remove <code></code>

  }
